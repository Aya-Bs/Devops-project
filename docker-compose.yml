services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql

  app-kaddem:
    depends_on:
      - mysqldb
    image: nousseiba/kaddem:1.0.0
    restart: on-failure
    ports:
      - "8089:8089"
    environment:
      SPRING_APPLICATION_JSON: '{
        "spring.datasource.url=jdbc:mysql://mysqldb:3306/kaddem?&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC",
        "spring.datasource.username": "root",
        "spring.datasource.password": "root",
        "spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5Dialect",
        "spring.jpa.hibernate.ddl-auto": "update"
      }'
      stdin_open: true
      tty: true


  sonarqube:
    image: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarQube_data:/opt/sonarqube/data
      - sonarQube_logs:/opt/sonarqube/logs
      - sonarQube_extensions:/opt/sonarqube/extensions

  nexus:
   image: sonatype/nexus3
   ports:
    - "8081:8081"
   volumes:
    - nexus_data:/nexus-data

volumes:
  sonarQube_data:
  sonarQube_logs:
  sonarQube_extensions:
  db:
  nexus_data:
