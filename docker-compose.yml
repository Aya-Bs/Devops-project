services:
  sqldb:
    image: mysql:5.7
    container_name: sqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
    ports:
      - "3307:3306"

  app-kaddem:
    image: nousseiba/kaddem:1.0.0
    container_name: app-kaddem
    restart: always
    depends_on:
      - sqldb
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://sqldb:3306/kaddem?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    ports:
      - "8090:8089"
