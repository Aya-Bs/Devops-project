version: "3.8"

services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=kaddem
    ports:
      - "3307:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - app-network

  app-kaddem:
    image: sarrahsahli/kaddem:latest
    restart: on-failure
    ports:
      - "8089:8089"
    environment:
      SPRING_APPLICATION_JSON: '{"spring.datasource.url":"jdbc:mysql://mysqldb:3306/kaddem?createDatabaseIfNotExist=true","spring.datasource.username":"root","spring.datasource.password":"root","spring.jpa.properties.hibernate.dialect":"org.hibernate.dialect.MySQL5Dialect","spring.jpa.hibernate.ddl-auto":"update","management.endpoints.web.base-path":"/actuator","management.endpoints.web.exposure.include":"*","management.endpoint.health.enabled":"true","management.endpoint.prometheus.enabled":"true","management.endpoint.metrics.enabled":"true","management.metrics.export.prometheus.enabled":"true","management.endpoint.health.show-details":"always","management.endpoints.enabled-by-default":"true","management.endpoints.web.cors.allowed-origins":"*","management.endpoints.web.cors.allowed-methods":"*","server.servlet.context-path":"/kaddem","spring.application.name":"kaddem","management.metrics.tags.application":"$${spring.application.name}"}'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/kaddem/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - app-network

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    depends_on:
      - app-kaddem
    networks:
      - app-network

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Sarahsahli123.
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_DATASOURCES_DEFAULT_TYPE=prometheus
      - GF_DATASOURCES_DEFAULT_URL=http://prometheus:9090
      - GF_DATASOURCES_DEFAULT_ACCESS=proxy
      - GF_DATASOURCES_DEFAULT_IS_DEFAULT=true
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db:
  grafana-data:
