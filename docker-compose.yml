services:
  mysqldb:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
    ports:
      - "3308:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10

  app-kaddem:
    depends_on:
      mysqldb:
        condition: service_healthy
    image: nousseiba/kaddem:1.0.0
    restart: on-failure
    ports:
      - "8090:8090"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/kaddem?useSSL=false&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/kaddem/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5





  sonarqube:
    image: sonarqube
    ports:
      - "9000:9000"
    volumes:
      - sonarQube_data:/opt/sonarqube/data
      - sonarQube_logs:/opt/sonarqube/logs
      - sonarQube_extensions:/opt/sonarqube/extensions

  nexus:
    image: sonatype/nexus3
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data

volumes:
  sonarQube_data:
  sonarQube_logs:
  sonarQube_extensions:
  db:
  nexus_data: