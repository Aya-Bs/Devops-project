services:
  mysqldb:
    image: mysql:5.7
    container_name: mysqldb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
    ports:
      - "3308:3306"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 10s
      retries: 10

  app-kaddem:
    depends_on:
      mysqldb:
        condition: service_healthy
    image: nousseiba/kaddem:1.0.0
    container_name: app-kaddem
    restart: on-failure
    ports:
      - "8092:8090"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/kaddem?useSSL=false&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: "root"
      SPRING_DATASOURCE_PASSWORD: "root"
      SPRING_JPA_HIBERNATE_DDL_AUTO: "update"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/kaddem/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
    depends_on:
      - prometheus





  sonarqube:
    image: sonarqube
    ports:
      - "9002:9000"
    volumes:
      - sonarQube_data:/opt/sonarqube/data
      - sonarQube_logs:/opt/sonarqube/logs
      - sonarQube_extensions:/opt/sonarqube/extensions

  nexus:
    image: sonatype/nexus3
    ports:
      - "8083:8081"
    volumes:
      - nexus_data:/nexus-data

volumes:
  sonarQube_data:
  sonarQube_logs:
  sonarQube_extensions:
  db:
  nexus_data:
  grafana-storage:
