services:
  mysqldb:
    image: mysql:5.7
    container_name: mysqldb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kaddem
    ports:
      - "3308:3306"

  app-kaddem:
    image: nousseiba/kaddem:1.0.0
    container_name: app-kaddem
    restart: always
    depends_on:
      - mysqldb
    ports:
      - "8092:8090"
    environment:
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysqldb:3306/kaddem?useSSL=false&createDatabaseIfNotExist=true"
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

