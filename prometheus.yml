global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-boot'
    metrics_path: '/kaddem/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app-kaddem:8089']
    scheme: 'http'
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__metrics_path__]
        target_label: metrics_path
      - source_labels: [__param_target]
        target_label: instance
      - target_label: application
        replacement: kaddem

  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['192.168.50.4:8080']
    basic_auth:
      username: 'admin'
      password: '11aa2c7e8c2e5579d5af9641a7b89e6f58'  # Remplacez ceci par votre token API Jenkins