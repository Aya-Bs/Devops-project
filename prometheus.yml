global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'spring-boot'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['spring-app:8089']
        labels:
          application: 'kaddem-app'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']