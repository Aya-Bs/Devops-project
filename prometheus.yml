global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'spring-boot'
    metrics_path: '/kaddem/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['app-kaddem:8089']
    tls_config:
      insecure_skip_verify: true
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: '([^:]+)(:[0-9]+)?'
        replacement: '${1}'

  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['192.168.50.4:8080']
    basic_auth:
      username: 'admin'
      password: '11aa2c7e8c2e5579d5af9641a7b89e6f58'
