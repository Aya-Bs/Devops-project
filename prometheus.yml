global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'spring-app'
    metrics_path: '/kaddem/actuator/prometheus'
    static_configs:
      - targets: ['kaddem-container:8089']
    scrape_interval: 5s